{% extends "base.html" %}

{% block title %}Subir Documento - Centro de Estudiantes{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Subir documento</h1>
            <p>Agregar estatuto, reglamento, formularios o normativa</p>
        </div>
        <a href="{{ url_for('institucional.documentos') }}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2>Datos del documento</h2>
        </div>
        <form method="POST" enctype="multipart/form-data">
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label class="form-label">Título *</label>
                        <input type="text" name="titulo" class="form-input" placeholder="Ej. Estatuto del Centro de Estudiantes" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-textarea" rows="4" placeholder="Descripción breve del documento"></textarea>
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label">Archivo *</label>
                        <input type="file" name="archivo" class="form-file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.jpeg,.png" required>
                    </div>
                </div>
            </div>
            <div class="card-footer form-actions">
                <a href="{{ url_for('institucional.documentos') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Subir documento</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
