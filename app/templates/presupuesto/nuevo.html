{% extends "base.html" %}

{% block title %}Nuevo Movimiento - Presupuesto{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Agregar movimiento</h1>
            <p>Registrar un ingreso o egreso en el presupuesto</p>
        </div>
        <a href="{{ url_for('presupuesto.index') }}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2>Datos del movimiento</h2>
        </div>
        <form method="POST" enctype="multipart/form-data">
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Tipo *</label>
                        <select name="tipo" class="form-select" required>
                            <option value="">Seleccionar...</option>
                            <option value="ingreso">Ingreso</option>
                            <option value="egreso">Egreso</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Fecha *</label>
                        <input type="date" name="fecha" class="form-input" required>
                    </div>

                    <div class="form-group form-group-full">
                        <label class="form-label">Concepto *</label>
                        <input type="text" name="concepto" class="form-input" placeholder="Ej. Venta de rifas, Compra de insumos" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Monto *</label>
                        <input type="number" step="0.01" name="monto" class="form-input" placeholder="0.00" required>
                    </div>

                    <div class="form-group form-group-full">
                        <label class="form-label">Comprobante (opcional)</label>
                        <input type="file" name="comprobante" class="form-file" accept="image/*,.pdf">
                    </div>
                </div>
            </div>
            <div class="card-footer form-actions">
                <a href="{{ url_for('presupuesto.index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar movimiento</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
