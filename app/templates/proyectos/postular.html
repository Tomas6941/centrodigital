{% extends "base.html" %}

{% block title %}Postular Proyecto - Centro de Estudiantes{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Postular proyecto</h1>
            <p>Completa los datos para enviar tu propuesta al Centro de Estudiantes</p>
        </div>
        <a href="{{ url_for('proyectos.index') }}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2>Datos de la postulación</h2>
        </div>
        <form method="POST">
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label class="form-label">Título del proyecto *</label>
                        <input type="text" name="titulo" class="form-input" placeholder="Ej. Renovación del patio" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Curso *</label>
                        <select name="curso" class="form-select" required>
                            {% for c in cursos %}
                            <option value="{{ c }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Monto estimado ($) *</label>
                        <input type="number" step="0.01" name="monto_estimado" class="form-input" placeholder="0.00" required>
                    </div>

                    <div class="form-group form-group-full">
                        <label class="form-label">Descripción *</label>
                        <textarea name="descripcion" class="form-textarea" rows="5" placeholder="Describe el proyecto..." required></textarea>
                    </div>

                    <div class="form-group form-group-full">
                        <label class="form-label">Objetivo *</label>
                        <textarea name="objetivo" class="form-textarea" rows="4" placeholder="¿Qué se busca lograr?" required></textarea>
                    </div>
                </div>
            </div>
            <div class="card-footer form-actions">
                <a href="{{ url_for('proyectos.index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Enviar postulación</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
