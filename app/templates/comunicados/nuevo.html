{% extends "base.html" %}

{% block title %}Nuevo Comunicado - Centro de Estudiantes{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Nuevo comunicado</h1>
            <p>Publicar un aviso para toda la comunidad</p>
        </div>
        <a href="{{ url_for('comunicados.index') }}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2>Datos del comunicado</h2>
        </div>
        <form method="POST">
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label class="form-label">Título *</label>
                        <input type="text" name="titulo" class="form-input" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label">Contenido *</label>
                        <textarea name="contenido" class="form-textarea" rows="8" required></textarea>
                    </div>
                    <div class="form-group form-group-full">
                        <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer;">
                            <input type="checkbox" name="destacado" value="1">
                            <span class="form-label" style="margin: 0;">Marcar como destacado</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="card-footer form-actions">
                <a href="{{ url_for('comunicados.index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Publicar comunicado</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
