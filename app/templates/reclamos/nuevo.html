{% extends "base.html" %}

{% block title %}Nuevo Reclamo - Centro de Estudiantes{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Nuevo reclamo</h1>
            <p>Describe tu reclamo o queja para que sea revisado</p>
        </div>
        <a href="{{ url_for('reclamos.index') }}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2>Datos del reclamo</h2>
        </div>
        <form method="POST">
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label class="form-label">Asunto *</label>
                        <input type="text" name="asunto" class="form-input" placeholder="Ej. Problema con el kiosco" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label">Descripción *</label>
                        <textarea name="descripcion" class="form-textarea" rows="6" placeholder="Describe detalladamente el reclamo..." required></textarea>
                    </div>
                </div>
            </div>
            <div class="card-footer form-actions">
                <a href="{{ url_for('reclamos.index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Enviar reclamo</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
