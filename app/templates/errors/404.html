{% extends "base.html" %}

{% block title %}Página no encontrada - Centro de Estudiantes{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 560px; margin: var(--space-16) auto;">
        <div class="empty-state">
            <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <h3>Página no encontrada</h3>
            <p>La página que buscás no existe o fue movida.</p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary" style="margin-top: var(--space-2);">Volver al inicio</a>
        </div>
    </div>
</div>
{% endblock %}
