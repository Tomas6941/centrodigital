{% extends "base.html" %}

{% block title %}Recuperar contraseña - Centro de Estudiantes{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="auth-logo">
            <h1>Recuperar contraseña</h1>
            <p>Ingresá tu correo electrónico</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-input" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Enviar instrucciones</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.login') }}" class="btn-link">Volver al inicio de sesión</a>
        </div>
    </div>
</div>
{% endblock %}
