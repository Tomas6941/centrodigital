{% extends "base.html" %}

{% block title %}Mi perfil - Centro de Estudiantes{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Mi perfil</h1>
            <p>Información de tu cuenta</p>
        </div>
        <a href="{{ url_for('auth.cambiar_contrasena') }}" class="btn btn-primary">Cambiar contraseña</a>
    </div>

    <div class="card" style="max-width: 640px;">
        <div class="card-header">
            <h2>Datos personales</h2>
        </div>
        <div class="card-body">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-input" value="{{ current_user.nombre }}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-input" value="{{ current_user.apellido }}" disabled>
                </div>
                <div class="form-group form-group-full">
                    <label class="form-label">Correo electrónico</label>
                    <input type="text" class="form-input" value="{{ current_user.email }}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Rol</label>
                    <input type="text" class="form-input" value="{{ current_user.rol.nombre }}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Curso</label>
                    <input type="text" class="form-input" value="{{ current_user.curso }}" disabled>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
