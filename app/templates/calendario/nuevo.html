{% extends "base.html" %}

{% block title %}Nuevo Evento - Calendario{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1>Nuevo evento</h1>
            <p>Agregar evento al calendario</p>
        </div>
        <a href="{{ url_for('calendario.index') }}" class="btn btn-secondary">Volver</a>
    </div>

    <div class="card form-card">
        <div class="card-header">
            <h2>Datos del evento</h2>
        </div>
        <form method="POST">
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label class="form-label">Título *</label>
                        <input type="text" name="titulo" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha *</label>
                        <input type="date" name="fecha" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hora</label>
                        <input type="time" name="hora" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Lugar</label>
                        <input type="text" name="lugar" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo</label>
                        <select name="tipo" class="form-select">
                            <option value="general">General</option>
                            <option value="reunion">Reunión</option>
                            <option value="votacion">Votación</option>
                            <option value="actividad">Actividad</option>
                        </select>
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-textarea" rows="4"></textarea>
                    </div>
                </div>
            </div>
            <div class="card-footer form-actions">
                <a href="{{ url_for('calendario.index') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar evento</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
